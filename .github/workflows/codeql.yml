name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "24 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          languages: python
      - uses: github/codeql-action/autobuild@bce182f857edf1feab116e9795a3393d21977282 # v4
      - uses: github/codeql-action/analyze@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          category: /language:python
